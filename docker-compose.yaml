services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-cognis}
            POSTGRES_USER: ${POSTGRES_USER:-cognis}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-cognis} -d ${POSTGRES_DB:-cognis}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    cognis:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: cognis:prod
        environment:
            DB_TYPE: postgresql
            DATABASE_URL: postgresql://${POSTGRES_USER:-cognis}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-cognis}
            HOST: ${HOST:-cognis}
            EXTERNAL_HOST: ${EXTERNAL_HOST:-}
        volumes:
            - applogs:/app/logs
            - appconfig:/app/config
            - appmedia:/app/media
        ports:
            - "${PORT:-3000}:3000"
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

volumes:
    pgdata:
    applogs:
    appconfig:
    appmedia:
