services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${POSTGRES_DB:-cognis}
            POSTGRES_USER: ${POSTGRES_USER:-cognis}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cognis}
        ports:
            - "5432:5432"
        volumes:
            - pgdata-dev:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U ${POSTGRES_USER:-cognis} -d ${POSTGRES_DB:-cognis}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    cognis-dev:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: cognis:dev
        environment:
            NODE_ENV: development
            COGNIS_UI_DEMO_MODE: "1"
            DATABASE_URL: postgresql://${POSTGRES_USER:-cognis}:${POSTGRES_PASSWORD:-cognis}@db:5432/${POSTGRES_DB:-cognis}
            # Required in dev too; define it in .env (see env.example).
            DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY}
            HOST: ${HOST}
            EXTERNAL_HOST: ${EXTERNAL_HOST}
            CONTACT_EMAIL: ${CONTACT_EMAIL}
            LOG_LEVEL: debug
            LOG_FILE: /app/logs/dev.log
        ports:
            - "${PORT:-3000}:3000"
        volumes:
            - ./:/app
            - node_modules_dev:/app/node_modules
            - applogs-dev:/app/logs
            - appconfig-dev:/app/config
        command: sh -c "npm ci --ignore-scripts && npm run start"
        depends_on:
            db:
                condition: service_healthy

volumes:
    pgdata-dev:
    node_modules_dev:
    applogs-dev:
    appconfig-dev:
