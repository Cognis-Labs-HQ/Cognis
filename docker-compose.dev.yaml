services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cognis
      POSTGRES_USER: cognis
      POSTGRES_PASSWORD: cognis
    ports:
      - '5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  cognis-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: cognis:dev
    environment:
      NODE_ENV: development
      COGNIS_UI_DEMO_MODE: '1'
      DB_TYPE: postgresql
      DATABASE_URL: postgresql://cognis:cognis@db:5432/cognis
      LOG_LEVEL: debug
      LOG_FILE: /var/log/cognis/dev.log
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/node_modules
    command: sh -c "npm ci --ignore-scripts && npm run start"
    depends_on:
      - db

volumes:
  pgdata-dev:
