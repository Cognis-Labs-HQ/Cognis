services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cognis
      POSTGRES_USER: cognis
      POSTGRES_PASSWORD: cognis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognis -d cognis"]
      interval: 10s
      timeout: 5s
      retries: 5

  cognis:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: cognis:prod
    environment:
      DB_TYPE: postgresql
      DATABASE_URL: postgresql://cognis:cognis@db:5432/cognis
      COGNIS_ACCESS_TOKEN_TTL_SECONDS: 43200
      MODULES_PATH: /app/src/modules/external
      COGNIS_MODULES_ROOT: /app/src/modules
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
