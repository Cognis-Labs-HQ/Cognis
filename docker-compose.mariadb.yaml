services:
    db:
        image: mariadb:11
        environment:
            MARIADB_DATABASE: cognis
            MARIADB_USER: cognis
            MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Set MARIADB_ROOT_PASSWORD}
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s
        restart: unless-stopped

    cognis:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        image: cognis:prod
        environment:
            DB_TYPE: mariadb
            MARIADB_HOST: db
            MARIADB_PORT: "3306"
            MARIADB_DATABASE: cognis
            MARIADB_USER: cognis
            MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Set MARIADB_PASSWORD}
            DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?Set DATA_ENCRYPTION_KEY}
            EXTERNAL_HOST: ${EXTERNAL_HOST:?Set EXTERNAL_HOST to the public Cognis URL}
            COGNIS_EXTERNAL_MODULES_ROOT: /app/external-modules
            COGNIS_MODULE_SOURCES_PATH: /app/config/module-sources.json
        volumes:
            - applogs:/app/logs
            - appconfig:/app/config
            - appmedia:/app/media
            - appmodules:/app/external-modules
        expose:
            - "3000"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "/usr/local/bin/healthcheck.sh"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s
        restart: unless-stopped

    cognis-web:
        image: nginx:stable-alpine
        environment:
            HOST: cognis
        ports:
            - "80:80"
        volumes:
            - ./docker/cognis-web/default.conf.template:/etc/nginx/templates/default.conf.template:ro
        depends_on:
            cognis:
                condition: service_healthy
        restart: unless-stopped

volumes:
    mariadb-data:
    applogs:
    appconfig:
    appmedia:
    appmodules:
