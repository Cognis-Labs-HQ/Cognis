services:
    db:
        image: mariadb:11
        environment:
            MARIADB_DATABASE: cognis
            MARIADB_USER: cognis
            MARIADB_PASSWORD: cognis
            MARIADB_ROOT_PASSWORD: cognis
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 5

    cognis:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        image: cognis:prod
        environment:
            DB_TYPE: mariadb
            DATABASE_URL: mysql://cognis:cognis@db:3306/cognis
        volumes:
            - applogs:/app/logs
            - appconfig:/app/config
            - appmedia:/app/media
        expose:
            - "3000"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "/usr/local/bin/healthcheck.sh"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s
        restart: unless-stopped

    cognis-web:
        build:
            context: ./docker/cognis-web
        image: cognis-web
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/tls:/etc/nginx/tls:ro
        depends_on:
            cognis:
                condition: service_healthy
        restart: unless-stopped

volumes:
    mariadb-data:
    applogs:
    appconfig:
    appmedia:
