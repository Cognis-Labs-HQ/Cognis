services:
    db:
        image: mariadb:11
        env_file:
            - docker/env/mariadb.env
            - docker/env/production.env
            - docker/env/mariadb-production.env
        environment:
            MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set}
            MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set}
        volumes:
            - mariadb-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 10s
            timeout: 5s
            retries: 5

    cognis:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: cognis:prod
        env_file:
            - docker/env/defaults.env
            - docker/env/mariadb.env
            - docker/env/production.env
            - docker/env/mariadb-production.env
        environment:
            DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
            DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY must be set}
        volumes:
            - applogs:/app/logs
            - appconfig:/app/config
            - appmedia:/app/media
        ports:
            - "3000:3000"
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

volumes:
    mariadb-data:
    applogs:
    appconfig:
    appmedia:
