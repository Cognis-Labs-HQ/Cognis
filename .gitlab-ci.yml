workflow:
    rules:
        - when: always

variables:
    APP_IMAGE_SHA: "$CI_REGISTRY_IMAGE:sha-$CI_COMMIT_SHORT_SHA"
    WEB_IMAGE_NAME: "$CI_REGISTRY_IMAGE/cognis-web"
    WEB_IMAGE_SHA: "$CI_REGISTRY_IMAGE/cognis-web:sha-$CI_COMMIT_SHORT_SHA"

cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
        - node_modules/

test:
    image: node:22-alpine
    script:
        - apk add ripgrep python3 build-base
        - npm ci
        - npm test
    tags:
        - shared
    rules:
        - if: $CI_COMMIT_BRANCH
        - if: $CI_COMMIT_TAG

publish:
    image: docker:27
    services:
        - docker:27-dind
    script:
        - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        - |
            if [ -n "$CI_COMMIT_TAG" ]; then
              REF_TAG="$CI_COMMIT_TAG"
            else
              REF_TAG="$CI_COMMIT_REF_SLUG"
            fi

            docker build -f docker/Dockerfile \
              -t "$CI_REGISTRY_IMAGE:$REF_TAG" \
              -t "$APP_IMAGE_SHA" \
              .

            docker build -f docker/cognis-web/Dockerfile \
              -t "$WEB_IMAGE_NAME:$REF_TAG" \
              -t "$WEB_IMAGE_SHA" \
              docker/cognis-web

            docker push "$CI_REGISTRY_IMAGE:$REF_TAG"
            docker push "$APP_IMAGE_SHA"
            docker push "$WEB_IMAGE_NAME:$REF_TAG"
            docker push "$WEB_IMAGE_SHA"

            if [ "$CI_COMMIT_BRANCH" = "master" ]; then
              docker tag "$APP_IMAGE_SHA" "$CI_REGISTRY_IMAGE:latest"
              docker tag "$WEB_IMAGE_SHA" "$WEB_IMAGE_NAME:latest"
              docker push "$CI_REGISTRY_IMAGE:latest"
              docker push "$WEB_IMAGE_NAME:latest"
            fi
    tags:
        - shared
