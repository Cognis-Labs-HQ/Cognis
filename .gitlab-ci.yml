stages:
  - test
  - docker

variables:
  IMAGE_NAME: registry.gitlab.firehawk-systems.com/firehawk/cognis

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

test:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm run ci:test
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

docker-build:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login registry.gitlab.firehawk-systems.com -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA" .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_TAG
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
