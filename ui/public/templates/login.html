<section class="login-frame" aria-label="Cognis sign in frame">
  <aside class="login-brand-card panel">
    <img src="/dashboard/static/public/assets/icons/cognis-icon.png" alt="Cognis" class="login-brand-icon" />
    <h1 class="login-brand-name" aria-label="Cognis app name">Cognis</h1>
    <p id="typed-template" class="login-typed-text" aria-live="polite" aria-label="Animated template text"></p>
  </aside>

  <main class="login-form-card panel">
    <h2>Sign in</h2>
    <form id="login-form" class="stack">
      <label class="login-field-label" for="username">Username</label>
      <input id="username" name="username" placeholder="Username" required />
      <label class="login-field-label" for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Password" required />
      <button type="submit">Login</button>
    </form>
    <p id="msg" class="login-message"></p>
  </main>
</section>
