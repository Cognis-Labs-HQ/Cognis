<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cognis - Login</title>
    <link rel="stylesheet" href="/dashboard/static/styles/page-builder.css" />
    <link rel="stylesheet" href="/dashboard/static/styles/login.css" />
  </head>
  <body>
    <section class="auth-page auth-page--login-frame">
      <div class="login-layout">
        <aside class="panel login-intro" aria-label="Cognis intro">
          <div class="login-brandline">
            <img src="/dashboard/static/assets/icons/cognis-icon.png" alt="Cognis" class="login-icon" />
            <div>
              <h1 class="login-title">Cognis</h1>
              <p class="login-typing">Disce. Loquere. Vive.</p>
            </div>
          </div>
          <p class="login-intro-copy">Try learning differently</p>
          <div class="login-template-box" aria-live="polite">
            <span id="typing-text"></span><span class="typing-cursor" aria-hidden="true">_</span>
          </div>
        </aside>

        <main class="panel login-panel" aria-label="Sign in">
          <h2 class="login-heading">Sign in</h2>
          <form id="login-form" class="stack login-form">
            <label>
              <span>Username</span>
              <input name="username" placeholder="Username" required />
            </label>
            <label>
              <span>Password</span>
              <input name="password" type="password" placeholder="Password" required />
            </label>
            <button type="submit">Login</button>
          </form>
          <p id="msg" class="login-message" role="status" aria-live="polite"></p>
        </main>
      </div>
    </section>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme"></button>
    <script type="module" src="/dashboard/static/app/login.js"></script>
  </body>
</html>
