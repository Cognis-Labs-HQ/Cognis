<section class="app-shell app-page binary-theme--dark" data-theme="dark">
  <header class="global-topbar site-header app-page__header">
    <nav class="topnav app-page__nav-surface">
      <a href="/dashboard">Dashboard</a>
      <a href="/docs">Docs</a>
    </nav>
    <div class="page-context">{{pageContext}}</div>
    <div class="profile-menu">
      <button id="profile-toggle">👤 <span id="profile-name">User</span></button>
      <div id="profile-dropdown" class="dropdown hidden">
        <button id="profile-logout">Logout</button>
      </div>
    </div>
  </header>
  <main class="workspace app-page__main">
    <header class="topbar">{{topbar}}</header>
    {{toolbar}}
    <section class="content-grid page-surface">{{content}}</section>
  </main>
</section>
