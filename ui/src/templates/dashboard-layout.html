<section class="app-shell app-page binary-theme--dark" data-theme="dark">
  <header class="site-header app-page__header">
    <div class="global-topbar">
      <a class="brandline" href="/dashboard" aria-label="Cognis home">
        <img src="/dashboard/static/assets/icons/cognis-icon.png" alt="Cognis" class="topbar-icon" />
        <strong>Cognis</strong>
      </a>
      <div class="page-context">{{pageContext}}</div>
    </div>

    <nav class="global-navrow" aria-label="Primary navigation">
      <div class="topnav global-navrow-surface">
        <a href="/dashboard">Dashboard</a>
      </div>
      <div class="account-cluster">
        <span class="user-greeting">Hello, <span id="profile-name">User</span></span>
        <button id="notification-toggle" class="notification-button" aria-label="Notifications">
          <span class="notification-badge-wrap"><span class="notification-icon" aria-hidden="true">🔔</span><span id="notification-count" class="notification-count" hidden>0</span></span>
        </button>
        <div class="profile-menu">
          <button id="profile-toggle" class="avatar-button" aria-label="Account options">
            <img src="/dashboard/static/assets/icons/cognis.png" alt="User avatar" class="avatar-image" />
          </button>
          <ul id="profile-dropdown" class="dropdown hidden user-dropdown-content">
            <li><a class="dropdown-item" href="/user">Profile</a></li>
            <li><a class="dropdown-item" href="/settings">Settings</a></li>
            <li><a class="dropdown-item" href="/docs">Docs</a></li>
            <li><button id="profile-logout" class="dropdown-item">Logout</button></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="workspace app-page__main">
    <section class="main-window {{workspaceClass}}">
      {{toolbar}}
      <section class="content-grid page-surface">{{content}}</section>
    </section>
    </main>
  <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">🌓</button>
</section>
