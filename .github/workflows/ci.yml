name: CI

permissions:
    contents: read

on:
    push:
        branches: ["**"]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Documentation contracts
              run: npm run check:docs

            - name: One changelog set per pull request
              if: github.event_name == 'pull_request'
              env:
                  DOCS_BASE_REF: ${{ github.base_ref }}
                  DOCS_HEAD_REF: ${{ github.head_ref }}
              run: npm run check:docs -- --base "origin/$DOCS_BASE_REF" --branch "$DOCS_HEAD_REF"

            - name: Full test suite
              run: npm test
