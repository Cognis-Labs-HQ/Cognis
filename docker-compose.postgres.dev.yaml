services:
    db:
        image: postgres:17-alpine
        env_file:
            - docker/env/postgres.env
            - docker/env/development.env
            - docker/env/postgres-development.env
        ports:
            - "5432:5432"
        volumes:
            - pgdata-dev:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    cognis-dev:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: cognis:dev
        env_file:
            - docker/env/defaults.env
            - docker/env/postgres.env
            - docker/env/development.env
            - docker/env/postgres-development.env
        ports:
            - "3000:3000"
        volumes:
            - ./:/app
            - node_modules_dev:/app/node_modules
            - applogs-dev:/app/logs
            - appconfig-dev:/app/config
        command: sh -c "npm ci --ignore-scripts && npm run start"
        depends_on:
            db:
                condition: service_healthy

volumes:
    pgdata-dev:
    node_modules_dev:
    applogs-dev:
    appconfig-dev:
