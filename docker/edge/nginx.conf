user nginx;
worker_processes auto;
pid /run/nginx.pid;
load_module modules/ngx_http_brotli_filter_module.so;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/html text/plain image/svg+xml;
    brotli on;
    brotli_comp_level 5;
    brotli_types application/json application/javascript text/css text/html text/plain image/svg+xml;

    ssl_session_cache shared:CognisTLS:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    upstream cognis_app {
        server cognis:3000;
        keepalive 64;
    }

    server {
        listen 80;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        location ~* ^/(?:static|assets)/.*[.-][0-9a-f]{8,}[.-] {
            proxy_pass http://cognis_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header Set-Cookie;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location ^~ /api/ {
            proxy_pass http://cognis_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_no_cache 1;
            proxy_cache_bypass 1;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
        }

        location / {
            proxy_pass http://cognis_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }
}
