<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 572" width="500" height="572" role="img" aria-label="Cognis">
  <defs>
    <radialGradient id="ci-sphere" cx="42%" cy="28%" r="70%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#86e020"/>
      <stop offset="18%" stop-color="#58bf14"/>
      <stop offset="42%" stop-color="#2f9d0c"/>
      <stop offset="70%" stop-color="#1a6a07"/>
      <stop offset="100%" stop-color="#093803"/>
    </radialGradient>
    <radialGradient id="ci-gloss" cx="40%" cy="22%" r="52%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="rgba(255,255,255,0.54)"/>
      <stop offset="48%" stop-color="rgba(255,255,255,0.14)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="ci-blue" x1="8%" y1="0%" x2="92%" y2="100%">
      <stop offset="0%" stop-color="#2e89d8"/>
      <stop offset="100%" stop-color="#145ab2"/>
    </linearGradient>
    <clipPath id="ci-clip">
      <circle cx="250" cy="330" r="198"/>
    </clipPath>
  </defs>

  <!-- graduation cap cords -->
  <path d="M188,115 Q155,162 150,202" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.88"/>
  <path d="M312,115 Q345,160 348,198" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.88"/>
  <!-- tassel ball -->
  <circle cx="348" cy="210" r="11" fill="white" opacity="0.92"/>

  <!-- cap base band -->
  <rect x="185" y="102" width="130" height="22" rx="5" fill="white" opacity="0.96"/>

  <!-- mortarboard top -->
  <polygon points="250,50 420,102 250,154 80,102" fill="white" opacity="0.97"/>
  <!-- subtle board bevel: left-top face slightly brighter -->
  <polygon points="250,50 80,102 250,154" fill="rgba(255,255,255,0.18)"/>

  <!-- main sphere -->
  <circle cx="250" cy="330" r="198" fill="url(#ci-sphere)"/>

  <!-- inner depth ring -->
  <circle cx="250" cy="330" r="180" fill="none" stroke="#0b4504" stroke-width="18" stroke-opacity="0.26"/>
  <circle cx="250" cy="330" r="179" fill="none" stroke="#24920c" stroke-width="3" stroke-opacity="0.20"/>

  <!-- speech bubbles clipped to sphere -->
  <g clip-path="url(#ci-clip)">
    <!-- left bubble: white, tail pointing down-left -->
    <path d="
      M163,248 Q163,222 189,222 L264,222
      Q264,222 264,248 L264,322
      Q264,348 238,348 L208,348
      L194,376 L197,348 L189,348
      Q163,348 163,322 Z
    " fill="white" fill-opacity="0.96"/>

    <!-- right bubble: blue, tail pointing down-right -->
    <path d="
      M264,235 L340,235
      Q366,235 366,261 L366,325
      Q366,351 340,351 L298,351
      L310,378 L286,351
      Q264,351 264,325 Z
    " fill="url(#ci-blue)"/>
  </g>

  <!-- "A" in left bubble -->
  <text
    x="208"
    y="323"
    font-family="Arial, Helvetica, sans-serif"
    font-size="88"
    font-weight="700"
    fill="#1e8018"
    text-anchor="middle"
  >A</text>

  <!-- "あ" in right bubble -->
  <text
    x="318"
    y="322"
    font-family="Arial, Helvetica, sans-serif"
    font-size="72"
    font-weight="400"
    fill="white"
    text-anchor="middle"
  >&#x3042;</text>

  <!-- sphere gloss highlight -->
  <ellipse cx="218" cy="252" rx="120" ry="74" fill="url(#ci-gloss)"/>
</svg>
