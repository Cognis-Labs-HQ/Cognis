<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="/static/styles/page-builder.css" />
        <link rel="stylesheet" href="/static/styles/reuse/page-sections.css" />
        <link
            rel="stylesheet"
            href="/static/gateways/auth/login-page/index.css"
        />
        <title>Authentication font loading fixture</title>
    </head>
    <body>
        <div id="app"></div>
        <template id="form">
            <h2 class="auth-heading" data-i18n="ui.app.login.title"></h2>
            <form class="auth-form stack">
                <label
                    ><span data-i18n="ui.app.login.form.username"></span
                    ><input autocomplete="username"
                /></label>
                <label
                    ><span data-i18n="ui.app.login.form.password"></span
                    ><input type="password" autocomplete="current-password"
                /></label>
                <a href="/login" data-i18n="ui.app.login.login_link.action"></a>
                <button data-i18n="ui.app.login.form.submit"></button>
            </form>
            <div class="sso-buttons"></div>
        </template>
        <script type="module" src="/fixture.js"></script>
    </body>
</html>
