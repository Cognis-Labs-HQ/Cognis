<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{{subject}}</title>
    </head>
    <body
        style="margin:0;padding:0;background:{{bgOuter}};font-family:Arial,Helvetica,sans-serif;"
    >
        <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="background:{{bgOuter}};padding:32px 16px;"
        >
            <tr>
                <td align="center">
                    <table
                        width="600"
                        cellpadding="0"
                        cellspacing="0"
                        style="max-width:600px;width:100%;border-radius:10px;overflow:hidden;box-shadow:0 8px 32px {{shadowColor}};"
                    >
                        <tr>
                            <td
                                style="background:{{bgHeader}};padding:24px 36px;border-bottom:2px solid {{colorAccent}};"
                            >
                                <table
                                    width="100%"
                                    cellpadding="0"
                                    cellspacing="0"
                                >
                                    <tr>
                                        <td>
                                            <table
                                                cellpadding="0"
                                                cellspacing="0"
                                            >
                                                <tr>
                                                    <td
                                                        style="
                                                            vertical-align: middle;
                                                            padding-right: 12px;
                                                        "
                                                    >
                                                        <img
                                                            src="{{iconUrl}}"
                                                            alt="Cognis"
                                                            width="36"
                                                            height="36"
                                                            style="
                                                                display: block;
                                                                border-radius: 6px;
                                                            "
                                                        />
                                                    </td>
                                                    <td
                                                        style="
                                                            vertical-align: middle;
                                                        "
                                                    >
                                                        <span
                                                            style="font-size:22px;font-weight:700;letter-spacing:0.12em;color:{{colorAccent2}};text-transform:uppercase;font-family:Arial,Helvetica,sans-serif;"
                                                            >COGNIS</span
                                                        >
                                                    </td>
                                                </tr>
                                            </table>
                                        </td>
                                        <td align="right">
                                            <span
                                                style="font-size:11px;color:{{colorMuted}};letter-spacing:0.08em;text-transform:uppercase;"
                                                >Notification</span
                                            >
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>

                        <tr>
                            <td
                                style="background:{{bgContent}};padding:28px 36px 8px;"
                            >
                                <p
                                    style="margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.1em;color:{{colorAccent2}};text-transform:uppercase;"
                                >
                                    Subject
                                </p>
                                <h1
                                    style="margin:0 0 20px;font-size:20px;font-weight:700;color:{{colorText}};line-height:1.3;"
                                >
                                    {{subject}}
                                </h1>
                            </td>
                        </tr>

                        <tr>
                            <td
                                style="background:{{bgContent}};padding:0 36px 28px;"
                            >
                                <div
                                    style="background:{{bgCard}};border-left:3px solid {{colorAccent}};border-radius:0 6px 6px 0;padding:18px 20px;"
                                >
                                    <p
                                        style="margin:0;font-size:15px;color:{{colorBodyText}};line-height:1.7;"
                                    >
                                        {{body}}
                                    </p>
                                </div>
                            </td>
                        </tr>

                        {{verifyButton}}

                        <tr>
                            <td
                                style="background:{{bgFooter}};padding:16px 36px;border-top:1px solid {{colorDivider}};"
                            >
                                <table
                                    width="100%"
                                    cellpadding="0"
                                    cellspacing="0"
                                >
                                    <tr>
                                        <td>
                                            <p
                                                style="margin:0;font-size:11px;color:{{colorFooterText}};line-height:1.5;"
                                            >
                                                Sent by
                                                <strong
                                                    style="color:{{colorAccent2}};"
                                                    >system</strong
                                                >
                                                from
                                                <a
                                                    href="{{externalHost}}"
                                                    style="color:{{colorAccent2}};text-decoration:none;"
                                                    >Cognis</a
                                                >. This is an automated
                                                notification &#8212; please do
                                                not reply to this message.
                                            </p>
                                        </td>
                                        <td
                                            align="right"
                                            style="padding-left: 16px"
                                        >
                                            <span
                                                style="font-size:10px;color:{{colorDiamond}};letter-spacing:0.08em;"
                                                >&#9670;</span
                                            >
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
