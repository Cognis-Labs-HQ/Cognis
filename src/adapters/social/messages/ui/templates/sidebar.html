<div class="messages-sidebar-content">
    <header class="messages-rooms-header">
        <button
            type="button"
            class="messages-new-btn btn-confirm"
            id="messages-new-btn"
        >
            {new_label}
        </button>
    </header>
    <ul class="messages-rooms-list" id="messages-rooms-list">
        {rooms}
    </ul>
    <section class="messages-sidebar-section">
        <button
            type="button"
            class="messages-sidebar-section-label messages-sidebar-section-label--btn btn-neutral"
            id="messages-open-templates-btn"
        >
            {templates_label}
        </button>
        <ul
            class="messages-sidebar-template-list"
            id="messages-sidebar-template-list"
        ></ul>
    </section>
</div>
