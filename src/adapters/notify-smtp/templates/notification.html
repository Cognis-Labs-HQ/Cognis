<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{subject}}</title>
</head>
<body style="margin:0;padding:0;background:#0a1628;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0a1628;padding:32px 16px;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;border-radius:10px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.45);">

          <tr>
            <td style="background:linear-gradient(135deg,#071421 0%,#0f2d3a 60%,#112b25 100%);padding:28px 36px 24px;border-bottom:2px solid #2a7f62;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <span style="font-size:22px;font-weight:700;letter-spacing:0.12em;color:#3aa783;text-transform:uppercase;font-family:Arial,Helvetica,sans-serif;">&#9670; COGNIS</span>
                  </td>
                  <td align="right">
                    <span style="font-size:11px;color:#4a8fa8;letter-spacing:0.08em;text-transform:uppercase;">Notification</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td style="background:#0d1f35;padding:28px 36px 8px;">
              <p style="margin:0 0 6px;font-size:11px;font-weight:600;letter-spacing:0.1em;color:#3aa783;text-transform:uppercase;">Subject</p>
              <h1 style="margin:0 0 20px;font-size:20px;font-weight:700;color:#e2e8f0;line-height:1.3;">{{subject}}</h1>
            </td>
          </tr>

          <tr>
            <td style="background:#0d1f35;padding:0 36px 28px;">
              <div style="background:rgba(255,255,255,0.04);border-left:3px solid #2a7f62;border-radius:0 6px 6px 0;padding:18px 20px;">
                <p style="margin:0;font-size:15px;color:#c8d8e8;line-height:1.7;">{{body}}</p>
              </div>
            </td>
          </tr>

          <tr>
            <td style="background:#081529;padding:16px 36px;border-top:1px solid rgba(42,127,98,0.25);">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <p style="margin:0;font-size:11px;color:#4a6a85;line-height:1.5;">
                      Sent by <strong style="color:#3aa783;">{{senderName}}</strong> via Cognis.
                      This is an automated notification — please do not reply to this message.
                    </p>
                  </td>
                  <td align="right" style="padding-left:16px;">
                    <span style="font-size:10px;color:#2a5068;letter-spacing:0.08em;">&#9670;</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
