services:
    db:
        image: postgres:17-alpine
        env_file:
            - ./docker/env/runtime.env
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    cognis:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        image: cognis:prod
        env_file:
            - ./docker/env/default.env
            - ./docker/env/runtime.env
        volumes:
            - applogs:/app/logs
            - appconfig:/app/config
            - appmedia:/app/media
        expose:
            - "3000"
        depends_on:
            db:
                condition: service_healthy
        restart: unless-stopped

    edge:
        build:
            context: ./docker/edge
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/tls:/etc/nginx/tls:ro
        depends_on:
            - cognis
        restart: unless-stopped

volumes:
    pgdata:
    applogs:
    appconfig:
    appmedia:
