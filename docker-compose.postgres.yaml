services:
    db:
        image: postgres:17-alpine
        env_file:
            - ./docker/env/runtime.env
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1' >/dev/null",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    cognis:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        image: cognis:prod
        env_file:
            - ./docker/env/default.env
            - ./docker/env/runtime.env
        volumes:
            - applogs:/app/logs
            - appconfig:/app/config
            - appmedia:/app/media
        expose:
            - "3000"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "/usr/local/bin/healthcheck.sh"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s
        restart: unless-stopped

    cognis-web:
        build:
            context: ./docker/cognis-web
        image: cognis-web
        env_file:
            - ./docker/env/cognis-web.env
        ports:
            - "${COGNIS_WEB_BIND_ADDRESS:-127.0.0.1}:80:80"
            - "${COGNIS_WEB_BIND_ADDRESS:-127.0.0.1}:443:443"
        volumes:
            - ./docker/tls:/etc/nginx/tls:ro
        depends_on:
            cognis:
                condition: service_healthy
        restart: unless-stopped

volumes:
    pgdata:
    applogs:
    appconfig:
    appmedia:
