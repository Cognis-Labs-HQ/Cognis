services:
    db:
        image: postgres:17-alpine
        env_file:
            - ./docker/env/runtime.env
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    cognis:
        build:
            context: .
            dockerfile: ./docker/Dockerfile
        image: cognis:prod
        env_file:
            - ./docker/env/default.env
            - ./docker/env/runtime.env
        volumes:
            - applogs:/app/logs
            - appconfig:/app/config
            - appmedia:/app/media
        expose:
            - "3000"
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "/usr/local/bin/healthcheck.sh"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s
        restart: unless-stopped

    cognis-web:
        build:
            context: ./docker/edge
        image: cognis-web
        environment:
            COGNIS_EDGE_TLS_MODE: ${COGNIS_EDGE_TLS_MODE:-terminate}
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/tls:/etc/nginx/tls:ro
        depends_on:
            cognis:
                condition: service_healthy
        restart: unless-stopped

volumes:
    pgdata:
    applogs:
    appconfig:
    appmedia:
